user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=10s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Classify normalized auth paths both before and after the /api/ rewrite.
    # Empty keys skip auth limits for reads, logout, refresh and unrelated endpoints.
    map "$request_method:$uri" $auth_client_key {
        default "";
        ~^POST:/(?:api/)?users/(?:login|confirm-registration|request-password-reset|confirm-password-reset|resend-confirmation)/?$ $binary_remote_addr;
        ~^POST:/(?:api/)?users/?$ $binary_remote_addr;
    }
    map $auth_client_key $auth_service_key {
        "" "";
        default "wwwhypda_auth";
    }

    # Per-client limits plus service-wide caps also bound traffic from many IPs.
    limit_req_zone $binary_remote_addr zone=wwwhypda_api_ip:10m rate=10r/s;
    limit_req_zone $server_name zone=wwwhypda_api_total:1m rate=50r/s;
    limit_req_zone $auth_client_key zone=wwwhypda_auth_ip:10m rate=30r/m;
    limit_req_zone $auth_service_key zone=wwwhypda_auth_total:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=wwwhypda_connections_ip:10m;
    limit_conn_zone $server_name zone=wwwhypda_connections_total:1m;
    limit_req_status 429;
    limit_conn_status 429;
    client_header_timeout 10s;
    client_body_timeout 30s;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.recaptcha.net/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src 'self' https://www.recaptcha.net/recaptcha/ https://recaptcha.google.com/recaptcha/; connect-src 'self' https://www.recaptcha.net/recaptcha/ http://localhost:8080 http://localhost:5173 http://localhost:3000; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;
        set $maintenance_hsts "";
        include /etc/nginx/maintenance/server.conf;
        location = /api {
            include /etc/nginx/maintenance/gate.conf;
            error_page 503 = @maintenance_api;
            return 404;
        }

        # Backend Proxy
        location /api/ {
            include /etc/nginx/maintenance/gate.conf;
            error_page 503 = @maintenance_api;
            # Allow normal UI bursts, reject excess before contacting the backend.
            limit_req zone=wwwhypda_api_ip burst=30 nodelay;
            limit_req zone=wwwhypda_api_total burst=100 nodelay;
            limit_req zone=wwwhypda_auth_ip burst=10 nodelay;
            limit_req zone=wwwhypda_auth_total burst=20 nodelay;
            limit_conn wwwhypda_connections_ip 20;
            limit_conn wwwhypda_connections_total 100;
            error_page 429 = @api_rate_limited;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            set $backend_upstream web:8082;
            # Fixture owns its /api prefix; production backend does not.
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @api_rate_limited {
            default_type application/json;
            return 429 '{"message":"Too many requests. Please wait and try again."}';
        }

        # Fixture-only routes. Production/dev config has no mock CAPTCHA route.
        location /__preview__/ {
            include /etc/nginx/maintenance/gate.conf;
            set $fixture_upstream web:8082;
            proxy_pass http://$fixture_upstream;
            proxy_set_header Host $http_host;
        }
        location = /recaptcha-frame.html {
            include /etc/nginx/maintenance/gate.conf;
            set $fixture_upstream web:8082;
            proxy_pass http://$fixture_upstream;
            proxy_set_header Host $http_host;
        }
        location ^~ /.well-known/acme-challenge/ { root /preview-acme; }
        # Frontend SPA
        location / {
            include /etc/nginx/maintenance/gate.conf;
            try_files $uri $uri/ /index.html;
        }

        # Deny access to .git, .env, etc.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
