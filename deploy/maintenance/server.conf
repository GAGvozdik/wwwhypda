# Include inside the actual server block. Before include, set $maintenance_hsts
# to existing production HSTS value, or empty string for localhost HTTP.
set $manual_maintenance false;
if (-f /maintenance-state/enabled) { set $manual_maintenance true; }
open_file_cache off;
error_page 503 /maintenance-page;
location = /maintenance-status {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    include /etc/nginx/maintenance/headers.conf;
    default_type application/json;
    return 200 '{"maintenance":$manual_maintenance}';
}
location = /maintenance-page {
    internal;
    default_type text/html;
    include /etc/nginx/maintenance/headers.conf;
    add_header Retry-After 300 always;
    alias /maintenance-public/index.html;
}
location @maintenance_api {
    include /etc/nginx/maintenance/headers.conf;
    add_header Retry-After 300 always;
    default_type application/json;
    return 503 '{"code":"site_maintenance","message":"Temporary maintenance. Please try again later."}';
}
location /maintenance/assets/ {
    include /etc/nginx/maintenance/headers.conf;
    alias /maintenance-public/assets/;
}
location = /privacy-policy { include /etc/nginx/maintenance/headers.conf; default_type text/html; alias /maintenance-public/privacy-policy.html; }
location = /cookie-policy { include /etc/nginx/maintenance/headers.conf; default_type text/html; alias /maintenance-public/cookie-policy.html; }
location = /user-agreement { include /etc/nginx/maintenance/headers.conf; default_type text/html; alias /maintenance-public/user-agreement.html; }
location /legal/ { include /etc/nginx/maintenance/headers.conf; default_type text/html; alias /maintenance-public/legal/; }
