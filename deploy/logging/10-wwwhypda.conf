# Receive only wwwhypda Docker logs on a host-loopback TCP listener.
# A separate ruleset prevents duplication into the default system log files.
module(load="imtcp")

ruleset(name="WwwhypdaLogs") {
    action(
        type="omfile"
        file="/var/log/wwwhypda/site.log"
        template="RSYSLOG_FileFormat"
        fileOwner="syslog"
        fileGroup="adm"
        fileCreateMode="0640"
        dirOwner="syslog"
        dirGroup="adm"
        dirCreateMode="0750"
        createDirs="on"
    )
    stop
}

input(
    type="imtcp"
    address="127.0.0.1"
    port="5514"
    ruleset="WwwhypdaLogs"
)
